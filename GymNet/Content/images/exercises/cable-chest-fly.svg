<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Cable towers -->
  <rect x="15" y="20" width="10" height="110" rx="3" fill="#13241F" opacity="0.85"/>
  <rect x="175" y="20" width="10" height="110" rx="3" fill="#13241F" opacity="0.85"/>
  <!-- Cables from top -->
  <line x1="25" y1="35" x2="80" y2="70" stroke="#13241F" stroke-width="3" opacity="0.6"/>
  <line x1="175" y1="35" x2="120" y2="70" stroke="#13241F" stroke-width="3" opacity="0.6"/>
  <!-- Figure standing centered -->
  <circle cx="100" cy="55" r="12" fill="#0E8F6E"/>
  <rect x="90" y="66" width="20" height="45" rx="8" fill="#0E8F6E"/>
  <!-- Arms extended out to the handles -->
  <rect x="60" y="66" width="9" height="34" rx="4" fill="#0E8F6E" transform="rotate(-70 64 83)"/>
  <rect x="131" y="66" width="9" height="34" rx="4" fill="#0E8F6E" transform="rotate(70 136 83)"/>
  <circle cx="80" cy="70" r="6" fill="#E2A63B"/>
  <circle cx="120" cy="70" r="6" fill="#E2A63B"/>
  <!-- Legs -->
  <rect x="92" y="108" width="9" height="30" rx="4" fill="#0E8F6E" transform="rotate(-8 96 123)"/>
  <rect x="100" y="108" width="9" height="30" rx="4" fill="#0E8F6E" transform="rotate(8 104 123)"/>
</svg>
